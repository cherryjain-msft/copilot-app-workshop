<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dealer Service Booking</title>
  <style>
    :root { --navy: #003478; --blue: #1f6feb; --ink: #0f172a; --muted: #64748b; --border: #e2e8f0; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 18px 32px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 600; }
    header p { margin: 4px 0 0; color: #cbd5e1; font-size: 14px; }
    main { max-width: 760px; margin: 28px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 24px; box-shadow: 0 1px 3px rgba(15, 23, 42, .06); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; }
    .slot { padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; text-align: center; font: inherit; }
    .slot small { display: block; color: var(--muted); font-size: 11px; }
    .ev-panel { margin-top: 20px; padding: 16px; border: 1px solid #86efac; border-radius: 8px; background: #f0fdf4; }
    .ev-panel[hidden], #slot-caption[hidden] { display: none; }
    .ev-panel h2 { margin: 0; font-size: 16px; }
    .ev-panel p { margin: 6px 0 12px; color: var(--muted); font-size: 13px; }
    .ev-tag { margin-left: 8px; color: #15803d; font-size: 12px; font-weight: 600; }
    .ev-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
    .ev-toggle[aria-pressed="true"] { border-color: var(--blue); }
    .ev-toggle-state { color: var(--muted); font-size: 13px; }
    .charger-count.available { color: #15803d; }
    .charger-count.none { color: #b45309; }
    #slot-caption { margin-top: 14px; }
    .slot[aria-pressed="true"] { border-color: var(--blue); background: #eff6ff; }
    .slot:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary:disabled { background: #94a3b8; cursor: not-allowed; }
    #message { margin-top: 14px; font-size: 14px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Dealer Service Booking</h1>
    <p>Book a service appointment at your local dealer (demo app · fictional data)</p>
  </header>
  <main>
    <form class="card" id="booking-form" novalidate>
      <div class="row">
        <div>
          <label for="customerName">Your name</label>
          <input id="customerName" name="customerName" autocomplete="name" required />
        </div>
        <div>
          <label for="vehicleType">Vehicle type</label>
          <select id="vehicleType" name="vehicleType">
            <option>Gas</option>
            <option>Hybrid</option>
            <option>EV</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="service">Service</label>
          <select id="service" name="service"></select>
        </div>
        <div>
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required />
        </div>
      </div>

      <section class="ev-panel" id="ev-panel" hidden>
        <h2>Reserve EV charging bay <span class="ev-tag">EV only</span></h2>
        <p>Charge while we service your vehicle · free during your appointment</p>
        <button class="ev-toggle" id="ev-toggle" type="button" aria-label="Reserve EV charging bay" aria-pressed="false">
          <span>Reserve charging bay</span><strong class="ev-toggle-state" id="ev-toggle-state">Off</strong>
        </button>
      </section>

      <label>Available times</label>
      <div class="muted" id="slot-caption" hidden>2 charging bays per hour</div>
      <div class="slots" id="slots"><span class="muted">Pick a date to see times.</span></div>

      <button class="primary" id="submit" type="submit" disabled>Book appointment</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let selectedTime = null;
    let cachedSlots = null;
    let evToggleOn = false;

    async function api(url, options) {
      const res = await fetch(url, options);
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Request failed");
      return body;
    }

    async function loadServices() {
      const services = await api(`/api/services?vehicleType=${$("vehicleType").value}`);
      $("service").innerHTML = services
        .map((s) => `<option value="${s.id}">${s.name} · ${s.durationMin} min</option>`)
        .join("");
    }

    async function loadSlots() {
      selectedTime = null;
      updateSubmit();
      const date = $("date").value;
      if (!date) {
        cachedSlots = null;
        renderSlots();
        return;
      }
      cachedSlots = null;
      renderSlots();
      const vehicleType = $("vehicleType").value;
      const data = await api(`/api/slots?date=${date}&vehicleType=${vehicleType}`);
      if (date !== $("date").value || vehicleType !== $("vehicleType").value) return;
      cachedSlots = data;
      renderSlots();
    }

    function renderSlots() {
      const data = cachedSlots;
      if (!data) {
        $("slots").innerHTML = '<span class="muted">Pick a date to see times.</span>';
        return;
      }
      if (!data.open) {
        selectedTime = null;
        updateSubmit();
        $("slots").innerHTML = '<span class="muted">Closed on Sundays — please pick another day.</span>';
        return;
      }
      $("slots").innerHTML = "";
      let selectedTimeIsAvailable = false;
      for (const slot of data.slots) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "slot";
        btn.disabled = !slot.available || (evToggleOn && !slot.evChargingAvailable);
        btn.setAttribute("aria-pressed", String(slot.time === selectedTime && !btn.disabled));
        btn.append(slot.time);
        const bays = document.createElement("small");
        bays.textContent = `${slot.remaining} ${slot.remaining === 1 ? "bay" : "bays"} left`;
        btn.appendChild(bays);
        if ($("vehicleType").value === "EV") {
          const chargerCount = document.createElement("small");
          const remaining = slot.evChargingRemaining;
          chargerCount.className = `charger-count ${remaining > 0 ? "available" : "none"}`;
          chargerCount.textContent = remaining === 0
            ? "⚡ No chargers"
            : `⚡ ${remaining} ${remaining === 1 ? "charger" : "chargers"}`;
          btn.appendChild(chargerCount);
        }
        if (slot.time === selectedTime && !btn.disabled) selectedTimeIsAvailable = true;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".slot").forEach((b) => b.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          selectedTime = slot.time;
          updateSubmit();
        });
        $("slots").appendChild(btn);
      }
      if (selectedTime && !selectedTimeIsAvailable) selectedTime = null;
      updateSubmit();
    }

    function updateSubmit() {
      $("submit").disabled = !selectedTime;
      $("submit").textContent = $("vehicleType").value === "EV" && evToggleOn
        ? "Book appointment + charging bay"
        : "Book appointment";
    }

    function updateEvPanel() {
      const isEv = $("vehicleType").value === "EV";
      $("ev-panel").hidden = !isEv;
      $("slot-caption").hidden = !isEv;
      if (!isEv) {
        evToggleOn = false;
        $("ev-toggle").setAttribute("aria-pressed", "false");
        $("ev-toggle-state").textContent = "Off";
      }
      updateSubmit();
    }

    $("ev-toggle").addEventListener("click", () => {
      evToggleOn = !evToggleOn;
      $("ev-toggle").setAttribute("aria-pressed", String(evToggleOn));
      $("ev-toggle-state").textContent = evToggleOn ? "On" : "Off";
      renderSlots();
    });

    $("vehicleType").addEventListener("change", async () => {
      updateEvPanel();
      await loadServices();
      await loadSlots();
    });
    $("date").addEventListener("change", loadSlots);

    $("booking-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("message");
      try {
        const payload = {
          customerName: $("customerName").value,
          vehicleType: $("vehicleType").value,
          service: $("service").value,
          date: $("date").value,
          time: selectedTime,
        };
        if ($("vehicleType").value === "EV" && evToggleOn) payload.evCharging = true;
        const booking = await api("/api/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        msg.className = "ok";
        msg.textContent = `Booked! Confirmation #${booking.id} — ${booking.date} at ${booking.time}.${booking.evCharging ? " EV charging bay reserved." : ""}`;
        await loadSlots();
      } catch (err) {
        msg.className = "err";
        msg.textContent = err.message;
      }
    });

    $("date").valueAsDate = new Date(Date.now() + 86400000);
    updateEvPanel();
    loadServices().then(loadSlots);
  </script>
</body>
</html>
